<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫學系 Block / 國考 分類題庫系統</title>
    <style>
        @import url("https://cdn.jsdelivr.net/npm/@fontsource/iansui/index.css");
        :root {
            --primary-color: #2b5876;
            --secondary-color: #4e4376;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --wrong-bg: #fee2e2;
            --wrong-border: #ef4444;
        }
        body {
            font-family: 'Iansui', '芫荽', 'Klee One', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            font-size: 20px;
        }
        button, input, textarea, select {
            font-family: inherit;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }
        .hidden {
            display: none !important;
        }
        .lobby-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 30px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .lobby-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            position: sticky;
            top: 10px;
            z-index: 100;
        }
        .back-btn {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .question-card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 24px;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .question-card.is-wrong {
            border-color: #fca5a5;
        }
        .question-card.is-correct {
            border-color: #86efac;
        }
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }
        .option-label {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }
        .option-label:hover {
            background-color: #f1f5f9;
            border-color: var(--primary-color);
        }
        .option-label.selected {
            background-color: #e0e7ff;
            border-color: #4f46e5;
        }
        .option-main-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .option-image {
            max-width: 100%;
            max-height: 220px;
            border-radius: 6px;
            margin-top: 4px;
            display: block;
            cursor: pointer;
        }
        .option-label.ans-correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            font-weight: bold;
            color: #15803d;
        }
        .option-label.ans-wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: #b91c1c;
        }
        .score-board {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
        }
        .score-item h4 { margin: 0 0 5px 0; font-size: 0.9rem; opacity: 0.8; }
        .score-item span { font-size: 1.8rem; font-weight: bold; }
        
        /* 篩選標籤膠囊樣式 */
        .filter-chip {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            background: white;
            color: #475569;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            user-select: none;
        }
        .filter-chip.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            font-weight: bold;
        }

        details summary::-webkit-details-marker { display: none; }
        details[open] summary .arrow-icon { transform: rotate(180deg); }
    </style>
</head>
<body>

<script>
const API_BASE_URL = "https://jimmyishandsomeboy.onrender.com";
const GAS_EXPLANATION_API = "https://script.google.com/macros/s/AKfycbzzrNQZVsa9x5Lz5vOhS8pv60MkQZQafdy-Lzj1IIG_Ms7GJTW0bTUIe7kcHz28_qZE/exec";

let currentBlockName = "";
let currentQuizName = "";
let rawLoadedQuestions = [];   // 當前科目從後端撈下來的所有題目
let currentQuestions = [];     // 經由老師、年份篩選後真正要作答的題目
let userAnswers = {};          
let isSubmitted = false;       

// 篩選器選取狀態 (Set)
let selectedYears = new Set();
let selectedTeachers = new Set();

// DOM 節點
const lobbyView = document.getElementById("lobby-view");
const modeSelectionZone = document.getElementById("mode-selection-zone");
const selectedBlockHint = document.getElementById("selected-block-hint");
const yearZone1 = document.getElementById("year-selection-zone-1");
const yearZone2 = document.getElementById("year-selection-zone-2");
const categoryView = document.getElementById("category-view");
const categoryList = document.getElementById("category-list");
const categoryQuizTitle = document.getElementById("category-quiz-title");

const quizView = document.getElementById("quiz-view");
const quizTitle = document.getElementById("quiz-title");
const quizProgressText = document.getElementById("quiz-progress-text");
const questionsContainer = document.getElementById("questions-container");
const btnSubmitAll = document.getElementById("btn-submit-all");
const resultSummaryCard = document.getElementById("result-summary-card");
const filterZone = document.getElementById("filter-zone");

const filterSelectionPanel = document.getElementById("filter-selection-panel");
const filterYearChips = document.getElementById("filter-year-chips");
const filterTeacherChips = document.getElementById("filter-teacher-chips");
const filteredCountBadge = document.getElementById("filtered-count-badge");

// 🎯 自動偵測文字裡的圖片網址（同時相容 Markdown 格式與純網址）
function extractImageFromText(text) {
    if (!text) return { cleanText: "", imageUrl: "" };

    // 優先匹配 Markdown: ![alt](url)
    const mdRegex = /!\[.*?\]\((https?:\/\/[^\s\)]+)\)/i;
    const mdMatch = text.match(mdRegex);
    if (mdMatch) {
        return {
            cleanText: text.replace(mdMatch[0], "").trim(),
            imageUrl: mdMatch[1]
        };
    }

    // 次之相容純圖片網址
    const imgUrlRegex = /(https?:\/\/\S+\.(?:png|jpg|jpeg|gif|webp))/i;
    const match = text.match(imgUrlRegex);
    if (match) {
        const imageUrl = match[1];
        const cleanText = text.replace(imageUrl, "").trim();
        return { cleanText, imageUrl };
    }

    return { cleanText: text, imageUrl: "" };
}

// 1. 選擇 Block
document.querySelectorAll(".block-select-btn").forEach(btn => {
    btn.addEventListener("click", function() {
        document.querySelectorAll(".block-select-btn").forEach(b => b.style.opacity = "0.6");
        this.style.opacity = "1";
        currentBlockName = this.getAttribute("data-block");

        selectedBlockHint.innerText = `已選擇：${this.innerText.replace("\n", " ").trim()}`;
        modeSelectionZone.classList.remove("hidden");
        yearZone1.classList.add("hidden");
        yearZone2.classList.add("hidden");
    });
});

// 模式 A：單一考卷
document.getElementById("btn-mode-by-year").addEventListener("click", () => {
    if (currentBlockName === "MED1") {
        yearZone1.classList.add("hidden");
        yearZone2.classList.remove("hidden");
    } else {
        yearZone2.classList.add("hidden");
        yearZone1.classList.remove("hidden");
    }
});

// 模式 B：跨年度專題特訓
document.getElementById("btn-mode-cross-year").addEventListener("click", async () => {
    try {
        categoryQuizTitle.innerText = `${currentBlockName} 跨年度歷屆科目特訓`;
        categoryList.innerHTML = "<p style='text-align:center;'>正在匯總各年度科目清單...</p>";
        
        lobbyView.classList.add("hidden");
        categoryView.classList.remove("hidden");
        quizView.classList.add("hidden");

        const response = await fetch(`${API_BASE_URL}/api/block_categories/${currentBlockName}`);
        if (!response.ok) throw new Error("無法取得科目分類");
        const categories = await response.json();

        categoryList.innerHTML = "";

        const allBtn = document.createElement("button");
        allBtn.innerText = `🔥 挑戰 ${currentBlockName} 全年度所有題目`;
        allBtn.className = "lobby-btn";
        allBtn.style.padding = "18px";
        allBtn.onclick = () => startQuizSession(`${API_BASE_URL}/api/block_questions/${currentBlockName}`, `${currentBlockName} - 全年度試題`, true);
        categoryList.appendChild(allBtn);

        categories.forEach(cat => {
            if (!cat) return;
            const btn = document.createElement("button");
            btn.innerText = `🎯 歷屆【${cat}】專題 (可選老師/年份)`;
            btn.style.cssText = "background-color: #ffffff; color: #166534; border: 2px solid #86efac; padding: 15px; font-size: 1.05rem; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: left;";
            btn.onclick = () => startQuizSession(`${API_BASE_URL}/api/block_questions/${currentBlockName}?category=${encodeURIComponent(cat)}`, `${currentBlockName} - ${cat}`, true);
            categoryList.appendChild(btn);
        });

    } catch (error) {
        alert("載入失敗: " + error.message);
        goBackToLobby();
    }
});

// 2. 選擇年份
document.querySelectorAll(".year-btn").forEach(btn => {
    btn.addEventListener("click", function() {
        const selectedYear = this.getAttribute("data-year");
        const yearDisplayName = this.innerText;
        currentQuizName = `${currentBlockName}_${selectedYear}`;
        openCategorySelection(currentQuizName, `${currentBlockName} ${yearDisplayName}`);
    });
});

// 3. 載入單一考卷科目
async function openCategorySelection(quizName, displayName) {
    try {
        categoryQuizTitle.innerText = displayName;
        categoryList.innerHTML = "<p style='text-align:center;'>正在從雲端載入科目分類...</p>";
        
        lobbyView.classList.add("hidden");
        categoryView.classList.remove("hidden");
        quizView.classList.add("hidden");

        const response = await fetch(`${API_BASE_URL}/api/categories/${quizName}`);
        if (!response.ok) throw new Error("無法取得科目分類");
        const categories = await response.json();

        categoryList.innerHTML = "";

        const allBtn = document.createElement("button");
        allBtn.innerText = "📚 挑戰整份考卷 (所有題目一次寫)";
        allBtn.className = "lobby-btn";
        allBtn.style.padding = "18px";
        allBtn.onclick = () => startQuizSession(`${API_BASE_URL}/api/questions/${quizName}`, displayName, false);
        categoryList.appendChild(allBtn);

        categories.forEach(cat => {
            if (!cat) return;
            const btn = document.createElement("button");
            btn.innerText = `📖 ${cat} (可選老師練習)`;
            btn.style.cssText = "background-color: #ffffff; color: #2b5876; border: 2px solid #cbd5e1; padding: 15px; font-size: 1.05rem; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: left;";
            btn.onclick = () => startQuizSession(`${API_BASE_URL}/api/questions/${quizName}?category=${encodeURIComponent(cat)}`, `${displayName} - ${cat}`, true);
            categoryList.appendChild(btn);
        });

    } catch (error) {
        alert("載入失敗: " + error.message);
        goBackToLobby();
    }
}

// 4. 統一發起測驗（抓取資料後初始化篩選面板）
async function startQuizSession(fetchUrl, title, enableFilters) {
    try {
        quizTitle.innerText = title;
        categoryView.classList.add("hidden");
        quizView.classList.remove("hidden");
        questionsContainer.innerHTML = "<p style='text-align:center; padding: 40px;'>正在準備題目，請稍候...</p>";

        const response = await fetch(fetchUrl);
        if (!response.ok) throw new Error("題庫讀取失敗");
        
        rawLoadedQuestions = await response.json();

        if (enableFilters) {
            setupFilterOptions();
            filterSelectionPanel.classList.remove("hidden");
        } else {
            filterSelectionPanel.classList.add("hidden");
            currentQuestions = [...rawLoadedQuestions];
            applyFilteredQuestions();
        }

        syncExplanationsFromSheet();
    } catch (err) {
        alert("讀取失敗: " + err.message);
        goBackToCategory();
    }
}

// 4-1. 建立老師與年份篩選按鈕
function setupFilterOptions() {
    selectedYears.clear();
    selectedTeachers.clear();

    const availableYears = new Set();
    const availableTeachers = new Set();

    rawLoadedQuestions.forEach(q => {
        if (q.year_label && q.year_label.trim() !== "") availableYears.add(q.year_label.trim());
        if (q.teacher && q.teacher.trim() !== "") availableTeachers.add(q.teacher.trim());
    });

    // 預設全選
    availableYears.forEach(y => selectedYears.add(y));
    availableTeachers.forEach(t => selectedTeachers.add(t));

    // 年份 UI
    const yearGroup = document.getElementById("filter-year-group");
    if (availableYears.size <= 1) {
        yearGroup.classList.add("hidden");
    } else {
        yearGroup.classList.remove("hidden");
        renderFilterChips(filterYearChips, Array.from(availableYears), selectedYears);
    }

    // 老師 UI
    const teacherGroup = document.getElementById("filter-teacher-group");
    if (availableTeachers.size === 0) {
        teacherGroup.classList.add("hidden");
    } else {
        teacherGroup.classList.remove("hidden");
        renderFilterChips(filterTeacherChips, Array.from(availableTeachers), selectedTeachers);
    }

    applyFilters();
}

function renderFilterChips(container, items, targetSet) {
    container.innerHTML = "";

    // 全部按鈕
    const allBtn = document.createElement("span");
    allBtn.className = "filter-chip active";
    allBtn.innerText = "全選";
    allBtn.onclick = () => {
        items.forEach(i => targetSet.add(i));
        container.querySelectorAll(".filter-chip").forEach(c => c.classList.add("active"));
        applyFilters();
    };
    container.appendChild(allBtn);

    // 各項目按鈕
    items.forEach(item => {
        const chip = document.createElement("span");
        chip.className = "filter-chip active";
        chip.innerText = item;
        chip.onclick = () => {
            if (targetSet.has(item)) {
                if (targetSet.size === 1) {
                    alert("至少需保留一個選項！");
                    return;
                }
                targetSet.delete(item);
                chip.classList.remove("active");
                allBtn.classList.remove("active");
            } else {
                targetSet.add(item);
                chip.classList.add("active");
                if (targetSet.size === items.length) allBtn.classList.add("active");
            }
            applyFilters();
        };
        container.appendChild(chip);
    });
}

// 4-2. 套用篩選過濾並刷新題目
function applyFilters() {
    currentQuestions = rawLoadedQuestions.filter(q => {
        const qYear = (q.year_label || "").trim();
        const qTeacher = (q.teacher || "").trim();

        const yearPass = selectedYears.size === 0 || !qYear || selectedYears.has(qYear);
        const teacherPass = selectedTeachers.size === 0 || !qTeacher || selectedTeachers.has(qTeacher);

        return yearPass && teacherPass;
    });

    filteredCountBadge.innerText = `符合 ${currentQuestions.length} 題`;
    applyFilteredQuestions();
}

function applyFilteredQuestions() {
    userAnswers = {};
    isSubmitted = false;

    resultSummaryCard.classList.add("hidden");
    filterZone.classList.add("hidden");
    btnSubmitAll.style.display = "inline-block";
    btnSubmitAll.innerText = "📝 寫完全部，交卷並批改";
    btnSubmitAll.disabled = false;

    renderAllQuestions();
    updateProgress();
}

// 產生選項 HTML
function renderOption(q, optLetter, optText) {
    const parsed = extractImageFromText(optText);
    const imgHtml = parsed.imageUrl
        ? `<img src="${parsed.imageUrl}" alt="選項${optLetter}圖片" class="option-image" onclick="event.preventDefault(); window.open(this.src, '_blank');">`
        : "";
    return `
        <label class="option-label" data-opt="${optLetter}">
            <div class="option-main-row">
                <input type="radio" name="ans_${q.id}" value="${optLetter}"> ${optLetter}. ${parsed.cleanText}
            </div>
            ${imgHtml}
        </label>
    `;
}

// 5. 渲染題目卡片
function renderAllQuestions() {
    questionsContainer.innerHTML = "";

    if (currentQuestions.length === 0) {
        questionsContainer.innerHTML = "<p style='text-align:center; padding: 40px; color: #94a3b8;'>⚠️ 目前篩選條件下沒有相符的題目，請重新調整篩選！</p>";
        return;
    }

    currentQuestions.forEach((q, idx) => {
        const qCard = document.createElement("div");
        qCard.className = "question-card";
        qCard.id = `q-card-${q.id}`;

        const questionParsed = extractImageFromText(q.question);
        let imgHtml = "";
        const finalImgUrl = (q.image_url && q.image_url.trim() !== "") ? q.image_url.trim() : questionParsed.imageUrl;
        
        if (finalImgUrl) {
            imgHtml = `
                <div style="text-align: center; margin: 15px 0;">
                    <img src="${finalImgUrl}" alt="題目圖" style="max-width: 100%; max-height: 350px; border-radius: 8px; cursor: pointer;" onclick="window.open(this.src, '_blank')">
                </div>
            `;
        }

        const yearTag = q.year_label ? `<span style="background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 4px; font-weight: 500;">📅 ${q.year_label}</span>` : "";
        const catTag = `<span style="background: #f1f5f9; color: #334155; padding: 2px 8px; border-radius: 4px; font-weight: 500;">📖 ${q.category || "未分類"}</span>`;
        const teacherTag = q.teacher ? `<span style="background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 4px; font-weight: 500;">👨‍🏫 ${q.teacher}</span>` : "";

        qCard.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
                <span style="color: #64748b; font-weight: bold;">第 ${idx + 1} 題 ｜ 題號：${q.id}</span>
                <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                    ${yearTag}
                    ${catTag}
                    ${teacherTag}
                </div>
            </div>
            <div style="font-size: 1.05rem; font-weight: 500; line-height: 1.6; margin-bottom: 12px;">${questionParsed.cleanText}</div>
            ${imgHtml}
            
            <div class="options-group" id="options-group-${q.id}">
                ${renderOption(q, "A", q.option_a)}
                ${renderOption(q, "B", q.option_b)}
                ${renderOption(q, "C", q.option_c)}
                ${renderOption(q, "D", q.option_d)}
            </div>

            <details id="exp-box-${q.id}" class="hidden" style="margin-top: 15px; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden;">
                <summary style="cursor: pointer; padding: 10px 15px; background: #fdf2f8; color: #9d174d; font-weight: bold; display: flex; justify-content: space-between;">
                    <span>💡 查看解析、筆記與 AI 詳解</span>
                    <span class="arrow-icon">▼</span>
                </summary>
                <div style="padding: 15px; background: white;">
                    <div id="exp-status-${q.id}" style="font-weight: bold; margin-bottom: 10px;"></div>
                    
                    <div style="background: #f0fdf4; border-left: 4px solid #22c55e; padding: 12px; margin-top: 10px; border-radius: 4px; font-size: 0.95rem; line-height: 1.6;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <strong style="color: #166534;">✨ AI 臨床解析 / 共筆筆記：</strong>
                            <div>
                                <button type="button" id="btn-edit-${q.id}" onclick="toggleEditExplanation('${q.id}')" style="background: #ffffff; border: 1px solid #86efac; color: #166534; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">✏️ 編輯解析</button>
                                <button type="button" id="btn-save-${q.id}" class="hidden" onclick="saveExplanationToSheet('${q.id}')" style="background: #16a34a; border: none; color: white; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold;">💾 儲存</button>
                                <button type="button" id="btn-cancel-${q.id}" class="hidden" onclick="cancelEditExplanation('${q.id}')" style="background: #94a3b8; border: none; color: white; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-left: 4px;">取消</button>
                            </div>
                        </div>

                        <div id="exp-text-view-${q.id}" style="white-space: pre-wrap; margin-top: 4px; color: #333;">${q.ai_explanation || '<span style="color: #94a3b8;">暫無解析，點擊右上角「編輯解析」新增...</span>'}</div>

                        <div id="exp-edit-view-${q.id}" class="hidden" style="margin-top: 8px;">
                            <div style="display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap;">
                                <button type="button" onclick="formatDoc('${q.id}', 'bold')" style="background: white; border: 1px solid #cbd5e1; border-radius: 4px; padding: 3px 8px; font-weight: bold; cursor: pointer;"><b>B 粗體</b></button>
                                <button type="button" onclick="formatColor('${q.id}', '#ef4444')" style="background: white; border: 1px solid #cbd5e1; border-radius: 4px; padding: 3px 8px; color: #ef4444; font-weight: bold; cursor: pointer;">🔴 紅筆</button>
                                <button type="button" onclick="formatHighlight('${q.id}', '#fef08a')" style="background: #fef08a; border: 1px solid #fde047; border-radius: 4px; padding: 3px 8px; color: #854d0e; font-weight: bold; cursor: pointer;">🖍️ 螢光筆</button>
                                <button type="button" onclick="formatDoc('${q.id}', 'removeFormat')" style="background: white; border: 1px solid #cbd5e1; border-radius: 4px; padding: 3px 8px; font-size: 0.8rem; color: #64748b; cursor: pointer;">🧹 清除格式</button>
                            </div>
                            <div id="exp-input-${q.id}" contenteditable="true" style="min-height: 120px; max-height: 350px; overflow-y: auto; background: white; border: 1.5px solid #86efac; border-radius: 6px; padding: 10px; font-size: 0.95rem; line-height: 1.6; outline: none;"></div>
                        </div>
                    </div>
                </div>
            </details>
        `;

        qCard.querySelectorAll(`input[name="ans_${q.id}"]`).forEach(radio => {
            radio.addEventListener("change", (e) => {
                if (isSubmitted) return;
                userAnswers[q.id] = e.target.value;
                
                qCard.querySelectorAll(".option-label").forEach(lbl => lbl.classList.remove("selected"));
                e.target.closest(".option-label").classList.add("selected");
                
                updateProgress();
            });
        });

        questionsContainer.appendChild(qCard);
    });
}

// 6. 更新進度
function updateProgress() {
    const answeredCount = Object.keys(userAnswers).length;
    const totalCount = currentQuestions.length;
    quizProgressText.innerText = `作答進度：${answeredCount} / ${totalCount} 題`;
}

// 7. 交卷與批改
btnSubmitAll.addEventListener("click", () => {
    const answeredCount = Object.keys(userAnswers).length;
    const totalCount = currentQuestions.length;

    if (totalCount === 0) return;

    if (answeredCount < totalCount) {
        const confirmSubmit = confirm(`你還有 ${totalCount - answeredCount} 題未作答，確定要現在交卷嗎？`);
        if (!confirmSubmit) return;
    }

    isSubmitted = true;
    let correctCount = 0;

    currentQuestions.forEach(q => {
        const userChoice = (userAnswers[q.id] || "").trim().toUpperCase();
        const correctAns = (q.correct_answer || "").trim().toUpperCase();
        const isCorrect = (userChoice !== "" && userChoice === correctAns) || correctAns === "送分" || correctAns === "ALL";
        
        const qCard = document.getElementById(`q-card-${q.id}`);
        const expBox = document.getElementById(`exp-box-${q.id}`);
        const expStatus = document.getElementById(`exp-status-${q.id}`);

        if (isCorrect) {
            correctCount++;
            qCard.classList.add("is-correct");
            expStatus.innerHTML = `<span style="color: #15803d;">🎉 答對了！標準答案：[ ${correctAns} ]</span>`;
        } else {
            qCard.classList.add("is-wrong");
            expStatus.innerHTML = `<span style="color: #b91c1c;">❌ 答錯了！你的選擇：[ ${userChoice || "未作答"} ] ｜ 正確答案：[ ${correctAns} ]</span>`;
        }

        qCard.querySelectorAll(".option-label").forEach(label => {
            const optVal = label.getAttribute("data-opt");
            const radio = label.querySelector("input");
            radio.disabled = true;

            if (optVal === correctAns) {
                label.classList.add("ans-correct");
            } else if (optVal === userChoice && !isCorrect) {
                label.classList.add("ans-wrong");
            }
        });

        expBox.classList.remove("hidden");
    });

    const wrongCount = totalCount - correctCount;
    const rate = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;

    document.getElementById("summary-total").innerText = totalCount;
    document.getElementById("summary-correct").innerText = correctCount;
    document.getElementById("summary-wrong").innerText = wrongCount;
    document.getElementById("summary-rate").innerText = `${rate}%`;

    resultSummaryCard.classList.remove("hidden");
    filterZone.classList.remove("hidden");
    btnSubmitAll.style.display = "none";

    window.scrollTo({ top: 0, behavior: 'smooth' });
});

// 8. 錯題過濾器
document.getElementById("btn-show-wrong-only").addEventListener("click", () => {
    currentQuestions.forEach(q => {
        const qCard = document.getElementById(`q-card-${q.id}`);
        if (qCard.classList.contains("is-correct")) {
            qCard.classList.add("hidden");
        } else {
            qCard.classList.remove("hidden");
        }
    });
});

document.getElementById("btn-show-all").addEventListener("click", () => {
    currentQuestions.forEach(q => {
        const qCard = document.getElementById(`q-card-${q.id}`);
        qCard.classList.remove("hidden");
    });
});

// 導航控制
function goBackToLobby() {
    quizView.classList.add("hidden");
    categoryView.classList.add("hidden");
    lobbyView.classList.remove("hidden");
}

function goBackToCategory() {
    quizView.classList.add("hidden");
    categoryView.classList.remove("hidden");
}

document.getElementById("btn-back-to-lobby").addEventListener("click", goBackToLobby);
document.getElementById("btn-back-to-category").addEventListener("click", goBackToCategory);

// 解析編輯與同步
function toggleEditExplanation(qId) {
    const q = currentQuestions.find(item => String(item.id) === String(qId));
    const currentText = q ? (q.ai_explanation || "") : "";

    document.getElementById(`exp-input-${qId}`).innerHTML = currentText;
    document.getElementById(`exp-text-view-${qId}`).classList.add("hidden");
    document.getElementById(`exp-edit-view-${qId}`).classList.remove("hidden");

    document.getElementById(`btn-edit-${qId}`).classList.add("hidden");
    document.getElementById(`btn-save-${qId}`).classList.remove("hidden");
    document.getElementById(`btn-cancel-${qId}`).classList.remove("hidden");
}

function cancelEditExplanation(qId) {
    document.getElementById(`exp-edit-view-${qId}`).classList.add("hidden");
    document.getElementById(`exp-text-view-${qId}`).classList.remove("hidden");

    document.getElementById(`btn-edit-${qId}`).classList.remove("hidden");
    document.getElementById(`btn-save-${qId}`).classList.add("hidden");
    document.getElementById(`btn-cancel-${qId}`).classList.add("hidden");
}

async function saveExplanationToSheet(qId) {
    const newExplanation = document.getElementById(`exp-input-${qId}`).innerHTML.trim();
    const saveBtn = document.getElementById(`btn-save-${qId}`);

    let editorName = localStorage.getItem("med_quiz_editor_name");
    if (!editorName) {
        editorName = prompt("請輸入您的姓名或暱稱（供共筆記錄，僅需輸入一次）：");
        if (!editorName || editorName.trim() === "") {
            editorName = "熱心同學";
        } else {
            localStorage.setItem("med_quiz_editor_name", editorName.trim());
        }
    }

    saveBtn.innerText = "儲存中...";
    saveBtn.disabled = true;

    try {
        await fetch(GAS_EXPLANATION_API, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                id: qId,
                explanation: newExplanation,
                editor: editorName
            })
        });

        const targetQ = currentQuestions.find(item => String(item.id) === String(qId));
        if (targetQ) targetQ.ai_explanation = newExplanation;

        const textView = document.getElementById(`exp-text-view-${qId}`);
        textView.innerHTML = newExplanation !== ""
            ? newExplanation
            : '<span style="color: #94a3b8;">暫無解析，點擊右上角「編輯解析」新增...</span>';

        cancelEditExplanation(qId);
        alert(`✅ 解析已成功同步儲存！(編輯者：${editorName})`);
    } catch (err) {
        alert("儲存失敗: " + err.message);
    } finally {
        saveBtn.innerText = "💾 儲存";
        saveBtn.disabled = false;
    }
}

async function syncExplanationsFromSheet() {
    try {
        const res = await fetch(GAS_EXPLANATION_API);
        if (!res.ok) return;
        const customExplanations = await res.json();

        currentQuestions.forEach(q => {
            const cloudExp = customExplanations[String(q.id)];
            if (cloudExp) {
                q.ai_explanation = cloudExp;
                const textView = document.getElementById(`exp-text-view-${q.id}`);
                if (textView) {
                    textView.innerHTML = cloudExp;
                }
            }
        });
        console.log("☁️ 雲端試算表最新詳解已於背景同步完成！");
    } catch (e) {
        console.warn("無法載入雲端試算表詳解，使用預設解析", e);
    }
}

function formatDoc(qId, cmd, val = null) {
    const editor = document.getElementById(`exp-input-${qId}`);
    if (!editor) return;
    editor.focus();
    document.execCommand(cmd, false, val);
}

function formatColor(qId, color) {
    const editor = document.getElementById(`exp-input-${qId}`);
    if (!editor) return;
    editor.focus();
    document.execCommand("foreColor", false, color);
}

function formatHighlight(qId, color) {
    const editor = document.getElementById(`exp-input-${qId}`);
    if (!editor) return;
    editor.focus();
    if (!document.execCommand("hiliteColor", false, color)) {
        document.execCommand("backColor", false, color);
    }
}
